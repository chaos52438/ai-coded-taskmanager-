<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="sidebar"><div class="title"><span class="hamb">☰</span><img class="brand-icon" src="/assets/icons/taskmanager-app.png" alt=""><b>Task Manager</b></div><nav id="nav"><button class="active" data-page="Processes"><i>▤</i>Processes</button><button data-page="Performance"><i>▥</i>Performance</button><button data-page="App history"><i>◷</i>App history</button><button data-page="Startup apps"><i>◉</i>Startup apps</button><button data-page="Users"><i>♙</i>Users</button><button data-page="Details"><i>☷</i>Details</button><button data-page="Services"><i>⚙</i>Services</button></nav><button class="settings" id="settingsButton">⚙ &nbsp; Settings</button></aside>
<main><header><h1 id="pageTitle">Processes</h1><div class="actions"><button class="action" id="runBtn">＋ &nbsp;Run new task</button><button class="action" id="endTop" disabled>⊗ &nbsp;End task</button><button class="action" id="effBtn" disabled>◉ &nbsp;Efficiency mode</button><button class="more" id="moreButton" aria-label="More options">···</button></div></header>
<section class="overview"><div class="search"><span>⌕</span><input id="search" placeholder="Type a name, publisher, or PID to search"></div><div class="statheads"><button class="stat" data-resource="CPU"><b id="cpuValue">—%</b><strong>CPU</strong><small id="cpuInfo">— GHz</small></button><button class="stat memory" data-resource="Memory"><b id="memValue">—%</b><strong>Memory</strong><small id="memInfo">— / —</small></button><button class="stat disk" data-resource="Disk"><b id="diskValue">—</b><strong>Disk</strong><small id="diskInfo">Read / Write</small></button><button class="stat network" data-resource="Network"><b id="netValue">—</b><strong>Network</strong><small id="netInfo">Receive / Send</small></button></div></section>
<section id="processPage" class="page"><div class="table-scroll"><table><thead><tr><th class="name sort" data-sort="name">Name <span>⌄</span></th><th>Status</th><th class="n sort" data-sort="cpu">CPU</th><th class="n sort" data-sort="memory">Memory</th><th class="n sort" data-sort="disk">Disk</th><th class="n">Network</th><th class="n pidcol sort" data-sort="pid">PID</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Loading processes…</div></div></section>
<section id="otherPage" class="page hidden"></section><footer><span><i></i> &nbsp;Updated live</span><span id="host"></span></footer></main>
<dialog id="settingsDialog"><form method="dialog"><div class="dialog-head"><div><small>TASK MANAGER</small><h2>Settings</h2></div><button class="dialog-close" value="close" aria-label="Close">×</button></div><label class="setting-row"><span><b>Refresh speed</b><small>How often process data updates</small></span><select id="refreshSetting"><option value="1000">High · 1 second</option><option value="2000">Normal · 2 seconds</option><option value="5000">Low · 5 seconds</option></select></label><label class="setting-row"><span><b>Appearance</b><small>Choose the app color theme</small></span><select id="themeSetting"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System default</option></select></label><label class="setting-row"><span><b>Confirm before ending tasks</b><small>Ask before sending a stop signal</small></span><input id="confirmSetting" type="checkbox"></label><div class="dialog-actions"><button value="close" class="action">Done</button></div></form></dialog>
<dialog id="startupDialog"><form method="dialog"><div class="dialog-head"><div><small>LOGIN</small><h2>Add a startup app</h2></div><button class="dialog-close" value="close" aria-label="Close">×</button></div><div class="startup-search"><input id="startupSearch" placeholder="Search installed apps…"></div><div id="startupChoices" class="startup-choices"></div><div class="dialog-actions"><button value="close" class="action">Done</button></div></form></dialog>
<div id="moreMenu" class="more-menu hidden"><button id="refreshNow">↻ &nbsp;Refresh now</button><button id="openSettings">⚙ &nbsp;Settings</button><button id="aboutButton">ⓘ &nbsp;About Task Manager</button></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
